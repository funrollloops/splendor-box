[project]
name = "splendor-box"
version = "0.1.0"
description = "Storage box organizer for Splendor board game components"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "solidpython2>=2.1.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
